<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Video Stream</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --warning: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .card {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h2 { margin-top: 0; font-size: 1.25rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.5rem; }

        .control-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        input {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            flex-grow: 1;
            font-size: 1rem;
        }

        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .status {
            font-size: 0.875rem;
            margin-bottom: 1rem;
            padding: 8px;
            border-radius: 4px;
            background: #f1f5f9;
            font-family: monospace;
        }

        .video-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .video-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
            color: #64748b;
        }

        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            object-fit: cover;
        }

        .peer-id-display {
            font-weight: bold;
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Host Section -->
        <div class="card">
            <h2>Host Mode</h2>
            <div class="status" id="host-status">Connecting to server...</div>
            <div class="control-group">
                <button id="start-btn" class="btn-primary" disabled>Start Hosting</button>
                <button id="stop-btn" class="btn-danger" disabled>Stop</button>
                <button id="host-reconnect-btn" class="btn-warning" style="display:none;">Reconnect</button>
                <span id="id-label" style="display:none;">Your ID: <span class="peer-id-display" id="my-id">...</span></span>
            </div>
            <div class="video-wrapper">
                <div class="video-label">Local Preview (Host Only)</div>
                <video id="local-video" autoplay playsinline muted></video>
            </div>
        </div>

        <!-- Guest Section -->
        <div class="card">
            <h2>Guest Mode</h2>
            <div class="status" id="guest-status">Connecting to server...</div>
            <div class="control-group">
                <input type="text" id="remote-id" placeholder="Enter Host Peer ID">
                <button id="join-btn" class="btn-primary" disabled>Join Stream</button>
                <button id="guest-reconnect-btn" class="btn-warning" style="display:none;">Reconnect</button>
            </div>
            <div class="video-wrapper">
                <div class="video-label">Remote Stream</div>
                <video id="remote-video" autoplay playsinline muted></video>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let localStream = null;
        let currentCall = null;

        const hostStatus = document.getElementById('host-status');
        const guestStatus = document.getElementById('guest-status');
        const myIdDisplay = document.getElementById('my-id');
        const idLabel = document.getElementById('id-label');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const hostRecBtn = document.getElementById('host-reconnect-btn');
        const joinBtn = document.getElementById('join-btn');
        const guestRecBtn = document.getElementById('guest-reconnect-btn');
        const remoteIdInput = document.getElementById('remote-id');
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');

        function initPeer() {
            if (peer) peer.destroy();

            // Reset UI
            hostRecBtn.style.display = 'none';
            guestRecBtn.style.display = 'none';
            hostStatus.innerText = "Connecting to signaling server...";
            guestStatus.innerText = "Connecting to signaling server...";
            joinBtn.disabled = true;
            startBtn.disabled = true;

            peer = new Peer();

            peer.on('open', (id) => {
                myIdDisplay.innerText = id;
                idLabel.style.display = 'inline';
                hostStatus.innerText = "Peer ready. Click 'Start Hosting' to stream.";
                guestStatus.innerText = "Ready to join a stream.";
                startBtn.disabled = false;
                joinBtn.disabled = false;
                console.log('PeerJS connected. ID:', id);
            });

            peer.on('error', (err) => {
                console.error('PeerJS Error:', err);
                
                if (err.type === 'socket-closed' || err.type === 'lost-connection') {
                    hostStatus.innerText = "Server connection lost.";
                    guestStatus.innerText = "Server connection lost.";
                    hostRecBtn.style.display = 'inline-block';
                    guestRecBtn.style.display = 'inline-block';
                    joinBtn.disabled = true;
                } else {
                    hostStatus.innerText = `Peer Error: ${err.type}`;
                }
            });

            peer.on('call', (call) => {
                if (localStream) {
                    call.answer(localStream);
                    handleCall(call);
                } else {
                    call.close();
                }
            });
        }

        async function startHosting() {
            try {
                const constraints = { video: { ideal: { width: 1280, height: 720 } }, audio: false };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                localVideo.srcObject = localStream;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                hostStatus.innerText = "Hosting active. Waiting for guests...";
            } catch (err) {
                hostStatus.innerText = "Camera error: " + err.message;
                alert("Camera access denied or not found.");
            }
        }

        function joinStream() {
            const hostId = remoteIdInput.value.trim();
            if (!hostId) return alert("Please enter a Host ID.");

            // Safety check: Ensure peer is actually connected to signaling server
            if (!peer || !peer.id) {
                return alert("Your connection to the signaling server is not active. Please reconnect.");
            }

            guestStatus.innerText = "Connecting to host...";
            try {
                const call = peer.call(hostId, null); 
                if (!call) {
                    throw new Error("Call failed to initialize. The signaling server may have dropped your connection. Please click 'Reconnect' and try again.");
                }
                handleCall(call);
            } catch (err) {
                guestStatus.innerText = "Connection failed.";
                alert(err.message);
            }
        }

        function handleCall(call) {
            currentCall = call;
            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
                guestStatus.innerText = "Stream active";
            });
            call.on('close', () => {
                guestStatus.innerText = "Connection closed.";
                remoteVideo.srcObject = null;
            });
            call.on('error', () => {
                guestStatus.innerText = "Stream error occurred.";
            });
        }

        function stopHosting() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localVideo.srcObject = null;
            }
            if (currentCall) currentCall.close();
            startBtn.disabled = false;
            stopBtn.disabled = true;
            hostStatus.innerText = "Hosting stopped.";
            guestStatus.innerText = "Disconnected";
            remoteVideo.srcObject = null;
        }

        startBtn.addEventListener('click', startHosting);
        stopBtn.addEventListener('click', stopHosting);
        joinBtn.addEventListener('click', joinStream);
        hostRecBtn.addEventListener('click', initPeer);
        guestRecBtn.addEventListener('click', initPeer);
        
        myIdDisplay.addEventListener('click', () => {
            navigator.clipboard.writeText(myIdDisplay.innerText);
            alert("ID copied!");
        });

        initPeer();
    </script>
</body>
</html>
