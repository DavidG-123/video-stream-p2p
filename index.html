<html><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeerJS Pixel Canvas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Pixel Canvas - P2P</h2>
    
    <div id="setup">
      <button onclick="host()">Host</button>
      <div class="setup-join">
        <input id="joinCode" placeholder="Enter host code">
        <button onclick="join()">Join</button>
      </div>
    </div>

    <div id="info">
      <strong>Your Code:</strong> <span id="code"></span>
    </div>

    <div id="chatArea">
      <div class="canvas-section">
        <h3>Your Canvas</h3>
        <div id="canvas" class="canvas"></div>
      </div>

      <div class="controls-section">
        <label for="colorPicker">Pick Color:</label>
        <input type="color" id="colorPicker" value="#3498db">
        
        <div class="preset-colors">
          <button class="color-btn" style="background: #ffffff;" onclick="setColor('#ffffff')" title="White"></button>
          <button class="color-btn" style="background: #000000;" onclick="setColor('#000000')" title="Black"></button>
          <button class="color-btn" style="background: #FF0000;" onclick="setColor('#FF0000')" title="Red"></button>
          <button class="color-btn" style="background: #00FF00;" onclick="setColor('#00FF00')" title="Green"></button>
          <button class="color-btn" style="background: #0000FF;" onclick="setColor('#0000FF')" title="Blue"></button>
          <button class="color-btn" style="background: #FFFF00;" onclick="setColor('#FFFF00')" title="Yellow"></button>
          <button class="color-btn" style="background: #FF00FF;" onclick="setColor('#FF00FF')" title="Magenta"></button>
          <button class="color-btn" style="background: #00FFFF;" onclick="setColor('#00FFFF')" title="Cyan"></button>
        </div>

        <button id="sendBtn" onclick="sendCanvas()" style="display: none; width: 100%;">Send Canvas</button>
      </div>

      <div class="canvas-section">
        <h3>Peer's Canvas</h3>
        <div id="peerCanvas" class="canvas"></div>
      </div>
    </div>

    <div id="status"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <script src="script.js"></script>
</body></html>
