<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Video Streaming</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; color: #4CAF50; }
        
        .controls {
            display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
            margin-bottom: 20px; padding: 20px; background: #2a2a2a; border-radius: 8px;
        }
        .controls input, .controls button {
            padding: 10px 20px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer;
        }
        .controls input { background: #3a3a3a; color: #fff; min-width: 150px; }
        .controls button { background: #4CAF50; color: white; font-weight: bold; transition: background 0.3s; }
        .controls button:hover:not(:disabled) { background: #45a049; }
        .controls button:disabled { background: #666; cursor: not-allowed; }
        
        .status {
            text-align: center; margin-bottom: 20px; padding: 15px;
            background: #2a2a2a; border-radius: 8px; font-size: 13px;
        }
        .status span { display: inline-block; margin-right: 30px; }
        .label { color: #aaa; font-weight: bold; }
        .value { color: #4CAF50; }
        
        .videos {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            margin-bottom: 20px;
        }
        .video-box {
            background: #000; border-radius: 8px; overflow: hidden;
            border: 2px solid #333; position: relative;
        }
        .video-box video { width: 100%; height: auto; display: block; background: #000; }
        .video-label {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7);
            padding: 5px 10px; border-radius: 4px; font-size: 12px; color: #aaa;
        }
        
        @media (max-width: 768px) {
            .videos { grid-template-columns: 1fr; }
            .controls { flex-direction: column; }
            .status span { display: block; margin: 8px 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ߎ堐2P Video Stream</h1>
        
        <div class="controls">
            <button id="startBtn" onclick="startBroadcast()">Start Broadcasting</button>
            <input type="text" id="roomId" placeholder="Room ID or paste to join" maxlength="8">
            <button id="joinBtn" onclick="joinRoom()">Join Stream</button>
            <button id="stopBtn" onclick="stop()" disabled>Stop</button>
        </div>
        
        <div class="status">
            <span><span class="label">Status:</span> <span class="value" id="status">Ready</span></span>
            <span><span class="label">Room:</span> <span class="value" id="roomDisplay">-</span></span>
            <span><span class="label">Peers:</span> <span class="value" id="peers">0</span></span>
            <span><span class="label">Connection:</span> <span class="value" id="connection">-</span></span>
        </div>
        
        <div class="videos">
            <div class="video-box">
                <video id="local" autoplay muted playsinline></video>
                <div class="video-label">ߓ頙our Stream</div>
            </div>
            <div class="video-box">
                <video id="remote" autoplay playsinline></video>
                <div class="video-label">ߑ堒emote Stream</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/trystero@latest/build/trystero.min.js"></script>
    <script>
        const localVideo = document.getElementById('local');
        const remoteVideo = document.getElementById('remote');
        const statusEl = document.getElementById('status');
        const roomDisplay = document.getElementById('roomDisplay');
        const peerCount = document.getElementById('peers');
        const connectionEl = document.getElementById('connection');
        const startBtn = document.getElementById('startBtn');
        const joinBtn = document.getElementById('joinBtn');
        const stopBtn = document.getElementById('stopBtn');
        const roomIdInput = document.getElementById('roomId');

        let room, stream, peers = {}, config = { iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }] };

        // Generate random room ID
        function genRoomId() { return Math.random().toString(36).substring(2, 8).toUpperCase(); }

        // Start broadcasting
        async function startBroadcast() {
            try {
                statusEl.textContent = 'Requesting camera...';
                stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
                localVideo.srcObject = stream;
                
                const rid = genRoomId();
                roomIdInput.value = rid;
                roomDisplay.textContent = rid;
                
                // Use DHT transport with IPFS fallback
                const { joinRoom: join } = window.Trystero || Trystero;
                room = join({ appId: 'p2p-stream', roomId: rid }, 'dht');
                
                setupRoom();
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusEl.textContent = 'Broadcasting...';
                connectionEl.textContent = 'Active';
            } catch (e) {
                statusEl.textContent = 'Camera error: ' + e.message;
            }
        }

        // Join existing stream
        async function joinRoom() {
            try {
                const rid = roomIdInput.value.trim().toUpperCase();
                if (!rid) return alert('Enter room ID');
                
                statusEl.textContent = 'Requesting camera...';
                stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
                localVideo.srcObject = stream;
                
                const { joinRoom: join } = window.Trystero || Trystero;
                room = join({ appId: 'p2p-stream', roomId: rid }, 'dht');
                
                roomDisplay.textContent = rid;
                setupRoom();
                startBtn.disabled = true;
                joinBtn.disabled = true;
                stopBtn.disabled = false;
                statusEl.textContent = 'Joining...';
                connectionEl.textContent = 'Connecting';
            } catch (e) {
                statusEl.textContent = 'Error: ' + e.message;
            }
        }

        // Setup room handlers
        function setupRoom() {
            const [sendVideo, getVideo] = room.makeAction('video');
            const [sendStats, getStats] = room.makeAction('stats');

            // Send local stream to peers
            const pc = new RTCPeerConnection({ iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }] });
            stream.getTracks().forEach(track => pc.addTrack(track, stream));

            pc.onicecandidate = e => {
                if (e.candidate) sendStats({ type: 'ice', candidate: e.candidate });
            };

            pc.onconnectionstatechange = () => {
                const state = pc.connectionState;
                connectionEl.textContent = state.charAt(0).toUpperCase() + state.slice(1);
                if (state === 'failed') statusEl.textContent = 'Connection failed';
            };

            pc.onnegotiationneeded = async () => {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                sendStats({ type: 'offer', sdp: offer.sdp });
            };

            // Receive and handle remote tracks
            pc.ontrack = e => {
                remoteVideo.srcObject = e.streams[0];
                statusEl.textContent = 'Connected';
            };

            // Handle signaling messages
            getStats((msg, peer) => {
                (async () => {
                    if (msg.type === 'offer') {
                        await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: msg.sdp }));
                        const ans = await pc.createAnswer();
                        await pc.setLocalDescription(ans);
                        sendStats({ type: 'answer', sdp: ans.sdp });
                    } else if (msg.type === 'answer') {
                        await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: msg.sdp }));
                    } else if (msg.type === 'ice' && msg.candidate) {
                        try { await pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch (e) {}
                    }
                })();
            });

            // Track peer connections
            room.onPeerJoin(peer => {
                peers[peer] = true;
                peerCount.textContent = Object.keys(peers).length;
                statusEl.textContent = 'Peer joined';
            });

            room.onPeerLeave(peer => {
                delete peers[peer];
                peerCount.textContent = Object.keys(peers).length;
                if (Object.keys(peers).length === 0) remoteVideo.srcObject = null;
                statusEl.textContent = 'Peer left';
            });
        }

        // Stop streaming
        function stop() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            if (localVideo) localVideo.srcObject = null;
            if (remoteVideo) remoteVideo.srcObject = null;
            if (room) room.leave();
            
            peers = {};
            roomIdInput.value = '';
            roomDisplay.textContent = '-';
            peerCount.textContent = '0';
            statusEl.textContent = 'Ready';
            connectionEl.textContent = '-';
            startBtn.disabled = false;
            joinBtn.disabled = false;
            stopBtn.disabled = true;
        }
    </script>
</body>
</html>
