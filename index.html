<!DOCTYPE html>
<html>
<head>
  <title>PeerJS Video Stream</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      background: #f0f0f0;
    }
    #setup {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
    }
    button:hover {
      background: #0056b3;
    }
    input {
      padding: 10px;
      margin: 5px;
      font-size: 16px;
      width: 200px;
    }
    #info {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    #code {
      font-size: 32px;
      font-weight: bold;
      color: #007bff;
      letter-spacing: 5px;
    }
    #status {
      font-size: 16px;
      color: #666;
      margin-top: 10px;
    }
    .video-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .video-box {
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    .video-box h3 {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      margin: 0;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 14px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #remoteVideo {
      display: none;
    }
    #remoteVideoContainer {
      display: none;
    }
    .hidden {
      display: none !important;
    }
    #streamStatus {
      font-size: 14px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>PeerJS Video Stream</h1>

  <div id="setup">
    <button onclick="host()">Host (Stream Video)</button>
    <div style="margin-top: 20px;">
      <input type="text" id="joinCode" placeholder="Enter host code">
      <button onclick="join()">Join</button>
    </div>
  </div>

  <div id="info">
    <h3>Your Code</h3>
    <div id="code"></div>
    <div id="status"></div>
    <div id="streamStatus"></div>
  </div>

  <div class="video-container">
    <div class="video-box">
      <h3>Your Video</h3>
      <video id="localVideo" autoplay muted playsinline></video>
    </div>
    <div class="video-box" id="remoteVideoContainer">
      <h3>Guest Video</h3>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <script src="peerjs.min.js"></script>
  <script src="script.js?v=1.3.0"></script>
</body>
</html>
