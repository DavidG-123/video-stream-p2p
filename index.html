<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P WebTorrent Video Streaming</title>
    <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; }
        .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .card h2 { color: #667eea; margin-bottom: 20px; border-bottom: 3px solid #667eea; padding-bottom: 10px; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .control-group input, .control-group button { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1em; }
        .control-group button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .control-group button:hover:not(:disabled) { transform: scale(1.02); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .control-group button:disabled { opacity: 0.5; cursor: not-allowed; }
        .video-wrapper { position: relative; width: 100%; padding-bottom: 75%; background: #000; border-radius: 10px; overflow: hidden; margin: 20px 0; }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.85em; z-index: 10; }
        .status-box { background: #f5f7fa; border-left: 4px solid #667eea; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 0.95em; }
        .status-box.success { border-left-color: #4caf50; background: #f1f8e9; }
        .status-box.error { border-left-color: #f44336; background: #ffebee; }
        .status-box.warning { border-left-color: #ff9800; background: #fff3e0; }
        .peer-count { display: inline-block; background: #667eea; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.85em; margin-top: 10px; font-weight: 600; }
        .console-box { background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 0.85em; max-height: 250px; overflow-y: auto; border: 1px solid #444; }
        .console-line { padding: 3px 0; display: flex; gap: 10px; }
        .console-timestamp { color: #888; flex-shrink: 0; }
        .console-error { color: #ff6b6b; }
        .console-warn { color: #ffd93d; }
        .console-info { color: #6bcf7f; }
        .hash-display { font-family: 'Courier New', monospace; font-size: 0.9em; word-break: break-all; }
        @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ߎ堐2P WebTorrent Video Streaming</h1>
            <p>DHT-based peer discovery with WebRTC streaming</p>
        </div>

        <div class="main-grid">
            <div class="card">
                <h2>ߓ᠓eeder (Streamer)</h2>
                <div class="control-group">
                    <button id="startStreamBtn" onclick="startStreaming()">▶️ Start Streaming</button>
                </div>
                <div class="control-group">
                    <button id="stopStreamBtn" onclick="stopStreaming()" disabled>⏹️ Stop Streaming</button>
                </div>
                <div id="seederStatus"></div>
                <div class="video-wrapper">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="video-label">Local Stream</div>
                </div>
                <div class="peer-count" id="seederPeerCount">Connected Peers: 0</div>
            </div>

            <div class="card">
                <h2>ߓ堌eecher (Viewer)</h2>
                <div class="control-group">
                    <label for="torrentHash">Torrent Info Hash:</label>
                    <input type="text" id="torrentHash" placeholder="Paste hash from Seeder panel...">
                </div>
                <div class="control-group">
                    <button id="joinStreamBtn" onclick="joinStream()">ߔ砊oin Stream</button>
                </div>
                <div class="control-group">
                    <button id="leaveStreamBtn" onclick="leaveStream()" disabled>❌ Leave Stream</button>
                </div>
                <div id="leecherStatus"></div>
                <div class="video-wrapper">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="video-label">Remote Stream</div>
                </div>
                <div class="peer-count" id="leecherPeerCount">Connected Peers: 0</div>
            </div>
        </div>

        <div class="card">
            <h2>ߖ寸ebug Console</h2>
            <div class="console-box" id="debugConsole"></div>
        </div>
    </div>

    <script>
        let client = null, torrent = null, localStream = null, peers = new Map();
        let isSeeder = false, isLeecher = false, torrentInfoHash = null;
        const consoleLogs = [];

        function log(msg, type = 'info') {
            const ts = new Date().toLocaleTimeString();
            consoleLogs.push({ ts, msg, type });
            if (consoleLogs.length > 100) consoleLogs.shift();
            renderConsole();
        }

        function renderConsole() {
            const el = document.getElementById('debugConsole');
            el.innerHTML = consoleLogs.map(l => `<div class="console-line"><span class="console-timestamp">[${l.ts}]</span><span class="console-${l.type}">${l.msg}</span></div>`).join('');
            el.scrollTop = el.scrollHeight;
        }

        function updateStatus(id, msg, type = 'info') {
            const el = document.getElementById(id);
            if (el) el.innerHTML = `<div class="status-box ${type}">${msg}</div>`;
        }

        window.addEventListener('load', () => {
            try {
                log('Initializing WebTorrent client...', 'info');
                client = new WebTorrent({ dht: true, tracker: true });
                log('WebTorrent ready', 'success');
            } catch (err) {
                log(`Init error: ${err.message}`, 'error');
            }
        });

        async function startStreaming() {
            try {
                log('Requesting camera access...', 'info');
                updateStatus('seederStatus', '⏳ Requesting camera...', 'warning');
                
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: true
                });

                document.getElementById('localVideo').srcObject = localStream;
                log('Camera access granted', 'success');

                // Create torrent with unique identifier
                const torrentData = {
                    name: 'stream-' + Date.now(),
                    files: [{ path: 'stream.webm', length: 1000000000 }]
                };

                client.seed(localStream, {
                    name: torrentData.name,
                    announceList: [
                        ['wss://tracker.openwebtorrent.com'],
                        ['wss://tracker.btorrent.xyz']
                    ]
                }, (t) => {
                    torrent = t;
                    torrentInfoHash = t.infoHash;
                    log(`Torrent created: ${torrentInfoHash}`, 'success');
                    updateStatus('seederStatus', `<strong>Hash:</strong><br><span class="hash-display">${torrentInfoHash}</span><br><small>Share this with peers</small>`, 'success');
                    
                    isSeeder = true;
                    document.getElementById('startStreamBtn').disabled = true;
                    document.getElementById('stopStreamBtn').disabled = false;

                    torrent.on('peer add', () => {
                        const count = torrent.numPeers || 0;
                        document.getElementById('seederPeerCount').textContent = `Connected Peers: ${count}`;
                        log(`Peer connected. Total: ${count}`, 'info');
                    });

                    torrent.on('peer remove', () => {
                        const count = torrent.numPeers || 0;
                        document.getElementById('seederPeerCount').textContent = `Connected Peers: ${count}`;
                        log(`Peer disconnected. Total: ${count}`, 'info');
                    });
                });

            } catch (err) {
                log(`Stream error: ${err.message}`, 'error');
                updateStatus('seederStatus', `❌ ${err.message}`, 'error');
            }
        }

        function stopStreaming() {
            try {
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                if (torrent) {
                    client.remove(torrent.infoHash);
                    torrent = null;
                }
                isSeeder = false;
                peers.forEach(p => p.destroy());
                peers.clear();
                
                document.getElementById('localVideo').srcObject = null;
                document.getElementById('startStreamBtn').disabled = false;
                document.getElementById('stopStreamBtn').disabled = true;
                document.getElementById('seederStatus').innerHTML = '';
                document.getElementById('seederPeerCount').textContent = 'Connected Peers: 0';
                
                log('Streaming stopped', 'info');
            } catch (err) {
                log(`Stop error: ${err.message}`, 'error');
            }
        }

        async function joinStream() {
            try {
                const hash = document.getElementById('torrentHash').value.trim();
                if (!hash) {
                    updateStatus('leecherStatus', '⚠️ Please enter a torrent hash', 'warning');
                    return;
                }

                log(`Joining torrent: ${hash}`, 'info');
                updateStatus('leecherStatus', '⏳ Connecting to peers...', 'warning');

                torrentInfoHash = hash;
                isLeecher = true;
                
                client.add(hash, { announceList: [['wss://tracker.openwebtorrent.com'], ['wss://tracker.btorrent.xyz']] }, (t) => {
                    torrent = t;
                    log(`Torrent joined, peers: ${t.numPeers}`, 'success');
                    updateStatus('leecherStatus', `✅ Connected to torrent`, 'success');
                    
                    document.getElementById('joinStreamBtn').disabled = true;
                    document.getElementById('leaveStreamBtn').disabled = false;
                    document.getElementById('torrentHash').disabled = true;

                    t.on('peer add', () => {
                        const count = t.numPeers || 0;
                        document.getElementById('leecherPeerCount').textContent = `Connected Peers: ${count}`;
                        log(`Peer joined. Total: ${count}`, 'info');
                    });

                    t.on('peer remove', () => {
                        const count = t.numPeers || 0;
                        document.getElementById('leecherPeerCount').textContent = `Connected Peers: ${count}`;
                        log(`Peer left. Total: ${count}`, 'info');
                    });

                    if (t.files.length > 0) {
                        t.files[0].streamTo(document.getElementById('remoteVideo'));
                        log('Streaming video to remote element', 'success');
                    }
                });

            } catch (err) {
                log(`Join error: ${err.message}`, 'error');
                updateStatus('leecherStatus', `❌ ${err.message}`, 'error');
            }
        }

        function leaveStream() {
            try {
                if (torrent) {
                    client.remove(torrent.infoHash);
                    torrent = null;
                }
                isLeecher = false;
                peers.forEach(p => p.destroy());
                peers.clear();

                document.getElementById('remoteVideo').srcObject = null;
                document.getElementById('torrentHash').value = '';
                document.getElementById('torrentHash').disabled = false;
                document.getElementById('joinStreamBtn').disabled = false;
                document.getElementById('leaveStreamBtn').disabled = true;
                document.getElementById('leecherStatus').innerHTML = '';
                document.getElementById('leecherPeerCount').textContent = 'Connected Peers: 0';

                log('Left torrent', 'info');
            } catch (err) {
                log(`Leave error: ${err.message}`, 'error');
            }
        }
    </script>
</body>
</html>
